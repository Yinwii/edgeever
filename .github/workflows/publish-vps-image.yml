# 为 VPS 构建并发布 EdgeEver 自托管镜像
#
# 说明
#   本工作流属于「下游更新层」。fork 每日自动对齐上游时，
#   .github/workflows/** 是被显式排除、不会被覆盖的（见 sync-edgeever-upstream.yml
#   的 "Refusing to publish an update that changes the downstream updater layer"）。
#
#   产出镜像：ghcr.io/yinwii/edgeever
#     :latest / :v<版本> / :<版本> / :sha-<短哈希>
#
# 触发方式
#   1) workflow_dispatch —— 由 sync-edgeever-upstream.yml 在同步出新版本后派发（主路径）
#   2) schedule          —— 兜底：每天 06:20 UTC（上游通常在 04:42 UTC 前后发版）
#   3) push main         —— 你手动改代码/手动推送时
#   4) release published —— 若在 fork 上打了 release
#
name: Publish VPS image

on:
  workflow_dispatch:
    inputs:
      ref:
        description: "要构建的 ref / ref to build (留空 = 默认分支)"
        required: false
        type: string
  schedule:
    - cron: "20 */4 * * *"   # 兜底：每 4 小时
  push:
    branches: [main]
    paths:
      - "apps/api/**"
      - "apps/web/**"
      - "packages/**"
      - "docs/**"
      - "scripts/self-hosted-*.mjs"
      - "migrations/**"
      - "patches/**"
      - "Dockerfile"
      - ".dockerignore"
      - "compose.yaml"
      - "bunfig.toml"
      - "package.json"
      - "bun.lock"
      - "tsconfig.json"
      - ".github/workflows/publish-vps-image.yml"
  release:
    types: [published]

permissions:
  contents: read
  packages: write

concurrency:
  group: edgeever-vps-image
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      IMAGE: ghcr.io/yinwii/edgeever
    steps:
      - name: 检出源码
        uses: actions/checkout@v5
        with:
          ref: ${{ inputs.ref || github.ref }}
          fetch-depth: 1

      - name: 读取版本号
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          version="$(node -p "require('./package.json').version" 2>/dev/null || echo 0.0.0)"
          {
            echo "version=${version}"
            echo "short=${GITHUB_SHA:0:12}"
          } >> "${GITHUB_OUTPUT}"
          echo "将构建版本 v${version}（${GITHUB_SHA:0:12}）"

      - name: 设置 Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 构建并推送
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          build-args: |
            EDGE_EVER_BUILD_ID=${{ github.sha }}
          tags: |
            ghcr.io/yinwii/edgeever:latest
            ghcr.io/yinwii/edgeever:v${{ steps.meta.outputs.version }}
            ghcr.io/yinwii/edgeever:${{ steps.meta.outputs.version }}
            ghcr.io/yinwii/edgeever:sha-${{ steps.meta.outputs.short }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 匿名拉取性检查 + 输出摘要
        shell: bash
        run: |
          set -euo pipefail
          image="${IMAGE}"
          anon_token="$(curl -fsS "https://ghcr.io/token?scope=repository:yinwii/edgeever:pull&service=ghcr.io" \
            | node -e 'let s="";process.stdin.on("data",d=>s+=d).on("end",()=>{try{console.log(JSON.parse(s).token||"")}catch{console.log("")}})' || true)"

          public="no"
          if [ -n "${anon_token}" ]; then
            code="$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer ${anon_token}" \
              -H "Accept: application/vnd.oci.image.index.v1+json,application/vnd.docker.distribution.manifest.list.v2+json,application/vnd.docker.distribution.manifest.v2+json" \
              "https://ghcr.io/v2/yinwii/edgeever/manifests/latest" || true)"
            [ "${code}" = "200" ] && public="yes"
          fi

          digest="$(docker buildx imagetools inspect "${image}:latest" --format '{{.Manifest.Digest}}' 2>/dev/null || echo unknown)"

          {
            echo "## EdgeEver VPS 镜像已发布 / Image published"
            echo ""
            echo "| 项目 | 值 |"
            echo "|---|---|"
            echo "| 镜像 | \`${image}\` |"
            echo "| 版本 | \`v${{ steps.meta.outputs.version }}\` |"
            echo "| latest 摘要 | \`${digest}\` |"
            echo "| 匿名可拉取 | **${public}** |"
            echo ""
            if [ "${public}" != "yes" ]; then
              echo "> ⚠️ 该包当前**不可匿名拉取**（GHCR 包默认私有）。"
              echo "> 到 https://github.com/users/Yinwii/packages/container/edgeever/settings"
              echo "> 把 Visibility 改成 **Public**，VPS 才能免密拉取；"
              echo "> 或在 VPS 上给 /root/.edgeever/ghcr.token 放一个只读 PAT。"
            fi
          } >> "${GITHUB_STEP_SUMMARY}"
